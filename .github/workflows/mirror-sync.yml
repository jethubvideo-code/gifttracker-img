name: Mirror Sync (§6.1)
on:
  schedule:
    - cron: "25 * * * *"
  workflow_dispatch:

concurrency:
  group: mirror
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.3.0
        with: { python-version: '3.12' }
      - run: pip install pillow -q
      - run: python sync.py
        env:
          SRC: https://raw.githubusercontent.com/jethubvideo-code/gifttracker-bot/main/docs/images.json
      - name: Commit
        run: |
          git config user.name "img-mirror"
          git config user.email "mirror@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "NO CHANGES" && exit 0
          git commit -m "mirror: sync $(date -u +%H:%M) [skip ci]"
          git push
